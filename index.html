<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Про нас</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .about-section {
      padding: 60px 0;
      background-color: #f8f9fa;
    }

    .about-section img {
      width: 100%;
      border-radius: 12px;
    }

    .about-image {
      order: -1;
      margin-bottom: 20px;
    }

    @media (min-width: 768px) {
      .about-image {
        order: 0;
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>

  <section class="about-section">
    <div class="container">
      <div class="row align-items-center">

        <div class="col-md-6 about-text">
          <h2>Про нас</h2>
          <p>
            Ми — команда розробників, які створюють сучасні, швидкі та адаптивні
            вебсайти. Наша мета — зробити ваш бізнес помітним в інтернеті.
          </p>
          <a href="#" class="btn btn-primary">Дізнатися більше</a>
        </div>

        <div class="col-md-6 about-image">
          <img src="html.png" alt="HTML">
        </div>

      </div>
    </div>
  </section>

</body>
</html>
